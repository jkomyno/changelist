[package]
name = "codemode"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A local Rust execution runtime for bounded agent-written tool workflows."
repository = "https://github.com/jkomyno/codemode"
license = "MIT"
publish = false
default-run = "codemode"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[features]
default = []
embedded-v8 = ["dep:deno_core", "dep:deno_ast", "dep:deno_error"]

[dependencies]
deno_core = { version = "=0.413.0", optional = true }
deno_ast = { version = "=0.53.3", features = ["transpiling"], optional = true }
deno_error = { version = "=0.7.1", optional = true }
rusqlite = { version = "0.37", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal", "fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
