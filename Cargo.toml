[package]
name = "codemode"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A local Rust execution runtime for bounded agent-written tool workflows."
repository = "https://github.com/jkomyno/codemode"
license = "MIT"
publish = false
default-run = "codemode"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal", "fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
