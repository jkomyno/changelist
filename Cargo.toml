[package]
name = "codemode"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A local Rust execution runtime for bounded agent-written tool workflows."
repository = "https://github.com/jkomyno/codemode"
license = "MIT"
publish = false
default-run = "codemode"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[features]
default = []
# Offline fixtures, mock tools, and fault injection for tests, demos, and evaluations.
# Never part of the production binary or the default library API.
testkit = []

[[bin]]
name = "codemode-fixture"
path = "src/bin/codemode-fixture.rs"
required-features = ["testkit"]

[[bin]]
name = "codemode-mcp-fixture"
path = "src/bin/codemode-mcp-fixture.rs"
required-features = ["testkit"]

[[bin]]
name = "codemode-recovery-eval"
path = "src/bin/codemode-recovery-eval.rs"
required-features = ["testkit"]

[dependencies]
deno_core = "=0.413.0"
deno_ast = { version = "=0.53.3", features = ["transpiling"] }
deno_error = "=0.7.1"
rusqlite = { version = "0.37", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal", "fs"] }
base64 = "0.23.1"
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

# Applies the worker's process data limit (RLIMIT_DATA) without unsafe code.
[target.'cfg(target_os = "linux")'.dependencies]
rlimit = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
