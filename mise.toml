min_version = "2026.9.2"

[tools]
# Keep mbx ahead of Rust's Cargo bin directory in PATH.
mr-boxington = "1.26.0"
rust = { version = "stable", profile = "minimal", components = ["clippy", "rustfmt"], mr_boxington = true }
deno = "2.9.8"

[tasks.check]
description = "Check formatting, lints, tests, and documentation"
env = { RUSTDOCFLAGS = "-D warnings" }
run = [
    "cargo fmt --all --check",
    "cargo clippy --locked --all-targets --all-features -- -D warnings",
    "cargo test --locked",
    "cargo doc --locked --no-deps",
]

[tasks.eval]
description = "Compare sequential, batch, and rolling dispatch on offline fixtures"
run = "cargo run --release --locked --bin codemode-eval -- --reps 21 --out eval/results"

[tasks.pi-demo]
description = "Run the offline Pi 1.4.0 integration example"
run = "integrations/pi/run-demo.sh"

[tasks.pi-check]
description = "Run native Pi 1.4.0 integration checks"
run = "mise exec npm:@earendil-works/pi-coding-agent@1.4.0 -- cargo test --locked --test pi -- --ignored"

[tasks.opencode-demo]
description = "Run the offline OpenCode 1.19.5 integration example"
run = "integrations/opencode/run-demo.sh"

[tasks.opencode-check]
description = "Run native OpenCode 1.19.5 integration checks"
run = "mise exec aqua:anomalyco/opencode@1.19.5 -- cargo test --locked --test opencode -- --ignored"

[tasks.composio-demo]
description = "Run the offline Composio provider example"
run = "integrations/composio/run-demo.sh"

[tasks.composio-live-check]
description = "Run read-only Composio tools through the logged-in Composio CLI"
run = "integrations/composio/run-live-check.sh"
