min_version = "2026.9.2"

[tools]
# Keep mbx ahead of Rust's Cargo bin directory in PATH.
mr-boxington = "1.26.0"
rust = { version = "stable", profile = "minimal", components = ["clippy", "rustfmt"], mr_boxington = true }
deno = "2.9.8"
node = "24.22.1"

[tasks.typecheck]
description = "Install locked development types and check the host adapters"
run = [
    "npm ci --ignore-scripts --no-audit --no-fund",
    "npm run typecheck",
]

[tasks.check]
description = "Check formatting, lints, tests, and documentation"
env = { RUSTDOCFLAGS = "-D warnings" }
run = [
    "cargo fmt --all --check",
    "cargo clippy --locked --all-targets --all-features -- -D warnings",
    "cargo test --locked",
    "cargo doc --locked --no-deps",
]

[tasks.embedded-check]
description = "Exercise the optional embedded worker and program backend contracts"
run = "cargo test --locked --features embedded-v8 --test embedded --test backend --test bridge_client"

[tasks.embedded-bench]
description = "Compare Deno and embedded workers, including prewarming, on shared offline fixtures"
run = [
    "cargo build --release --locked --features embedded-v8 --bin codemode",
    "mise exec bun@1.4.4 -- bun bench/run.ts --engines codemode,codemode-prewarm,codemode-embedded,codemode-embedded-prewarm --scenarios noop,triage,triage-large --profiles zero,mixed --reps 15 --warmup 2 --cold 5 --out bench/results/embedded-local",
]

[tasks.pi-demo]
description = "Run the offline Pi 1.4.0 integration example"
run = "integrations/pi/run-demo.sh"

[tasks.pi-check]
description = "Run native Pi 1.4.0 integration checks"
run = "mise exec npm:@earendil-works/pi-coding-agent@1.4.0 -- cargo test --locked --all-features --test pi --test pi_plan -- --ignored"

[tasks.opencode-demo]
description = "Run the offline OpenCode 1.19.5 integration example"
run = "integrations/opencode/run-demo.sh"

[tasks.opencode-check]
description = "Run native OpenCode 1.19.5 integration checks"
run = "mise exec aqua:anomalyco/opencode@1.19.5 -- cargo test --locked --all-features --test opencode -- --ignored"

[tasks.composio-demo]
description = "Run the offline Composio provider example"
run = "integrations/composio/run-demo.sh"

[tasks.composio-live-check]
description = "Run read-only Composio tools through the logged-in Composio CLI"
run = "integrations/composio/run-live-check.sh"

[tasks.composio-plan-check]
description = "Run the offline Composio plan host checks: lost reply, killed executor, resume"
run = "cargo test --locked --test composio_plan"

[tasks.composio-plan-preflight]
description = "Read-only Composio plan preflight for one issue and label: <owner/repo> <issue> <label>"
run = "integrations/composio/run-plan-preflight.sh"

[tasks.bench-setup]
description = "Fetch and verify the pinned code-mode engines and build the release binary"
run = "mise exec bun@1.4.4 -- bench/setup.sh"

[tasks.bench-verify]
description = "Check benchmark expected outputs with two independent implementations"
run = "mise exec bun@1.4.4 -- bench/verify-expected.sh"

[tasks.bench]
description = "Benchmark codemode, Pi, and OpenCode code-mode engines on shared fixtures"
run = "mise exec bun@1.4.4 -- bun bench/run.ts --engines codemode,codemode-c4,codemode-prewarm,pi,opencode --scenarios triage,triage-large,denied,deadline,guest-exception,lost-response --profiles zero,equal,mixed --reps 20 --warmup 3 --cold 8 --out bench/results/local"

[tasks.demo]
description = "Run the offline demonstration: a workflow, prewarming, a denial, a lost response, and inspection"
run = [
    "cargo build --release --locked --bin codemode",
    "mise exec bun@1.4.4 -- bun bench/demo.ts",
]

[tasks.recovery-demo]
description = "Run the offline recovery demonstration: approve a batch, kill the executor, reconcile, and review"
run = "examples/recovery/demo.sh"

[tasks.recovery-eval]
description = "Compare recovery strategies after a killed run, and measure journal overhead"
run = [
    "cargo build --release --locked --bin codemode",
    "mkdir -p eval/recovery-local",
    "cargo run --release --locked --bin codemode-recovery-eval -- --reps 15 --out eval/recovery-local > eval/recovery-local/summary.md",
]
