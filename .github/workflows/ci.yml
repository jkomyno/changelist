name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Show mise-managed build tools
        run: |
          mise exec -- rustc --version
          mise exec -- mbx --version
      - run: mise run check
      - name: Run the offline demo
        run: mise run demo

  msrv:
    name: Rust 1.91 (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install minimum supported Rust
        run: mise exec -- rustup toolchain install 1.91.0 --profile minimal
      - name: Test MSRV through mise and Mr Boxington
        run: |
          mise exec -- mbx --version
          mise exec -- cargo +1.91.0 test --locked --all-features
